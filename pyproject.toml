[project]
name = "pqlab"
version = "0.1.0"
description = "Reproducible byte-level teardown of Apache Parquet"
requires-python = ">=3.11"
dependencies = [
    "pyarrow==25.0.1",
    "numpy>=2.0,<3",
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pqlab"]